<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>BBDownT 下载器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='7' width='26' height='19' rx='5' fill='%23fb7299'/%3E%3Cpath d='M10 3l4 4M22 3l-4 4' stroke='%23fb7299' stroke-width='2.5' stroke-linecap='round'/%3E%3Cpath d='M16 12v8m-3.5-3.5L16 20l3.5-3.5' stroke='white' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #f4f5f7;
  --surface: #ffffff;
  --surface-2: #f6f7f9;
  --border: #e3e5e7;
  --text: #18191c;
  --text-2: #61666d;
  --text-3: #9499a0;
  --pink: #fb7299;
  --pink-soft: #fff0f4;
  --blue: #00aeec;
  --blue-soft: #e6f7fd;
  --green: #2bb673;
  --green-soft: #e8f8ef;
  --red: #f25d59;
  --red-soft: #fdeeee;
  --amber: #f2a33a;
  --amber-soft: #fef5e7;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.04);
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111214;
    --surface: #1b1c1f;
    --surface-2: #232428;
    --border: #2e3035;
    --text: #e7e8ea;
    --text-2: #a5a9b0;
    --text-3: #747982;
    --pink-soft: #3a2029;
    --blue-soft: #10303c;
    --green-soft: #15301f;
    --red-soft: #3a1d1c;
    --amber-soft: #3a2c15;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.55 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
[hidden] { display: none !important; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px 48px; }

/* header */
header {
  position: sticky; top: 0; z-index: 10;
  background: color-mix(in srgb, var(--bg) 85%, transparent);
  backdrop-filter: saturate(1.4) blur(12px);
  -webkit-backdrop-filter: saturate(1.4) blur(12px);
}
.bar { max-width: 960px; margin: 0 auto; padding: 14px 16px; display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; letter-spacing: .2px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand small { font-weight: 400; color: var(--text-3); font-size: 12px; }
.spacer { flex: 1; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; white-space: nowrap; font-size: 13px;
}
.chip:hover { border-color: var(--pink); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
.chip.ok .dot { background: var(--green); }
.chip.warn .dot { background: var(--amber); }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 8px; cursor: pointer; color: var(--text-2); display: inline-flex; }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn svg { width: 18px; height: 18px; }

/* cards */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
.composer { padding: 18px; margin-top: 4px; }
.url-row { display: flex; gap: 10px; align-items: stretch; }
textarea.url {
  flex: 1; min-height: 46px; max-height: 160px; resize: vertical;
  padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border);
  background: var(--surface-2); outline: none; line-height: 1.5;
}
textarea.url:focus { border-color: var(--pink); background: var(--surface); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 0 18px; min-height: 38px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface); cursor: pointer; white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--text-3); }
.btn.primary { background: var(--pink); border-color: var(--pink); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.05); }
.btn.primary:disabled { opacity: .6; cursor: default; }
.btn.small { min-height: 30px; padding: 0 12px; font-size: 13px; border-radius: 8px; }
.btn.danger { color: var(--red); }
.btn.danger:hover { border-color: var(--red); }
.btn svg { width: 16px; height: 16px; }
.url-row .btn.primary { min-width: 108px; }

.opts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 14px; }
.field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.field select, .field input[type=text], .field input[type=number], .field input[type=password] {
  width: 100%; height: 36px; padding: 0 10px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface-2); outline: none;
}
.field select:focus, .field input:focus { border-color: var(--pink); }
.toggles { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.toggle {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px;
  border-radius: 999px; border: 1px solid var(--border); cursor: pointer; user-select: none;
  font-size: 13px; color: var(--text-2);
}
.toggle input { display: none; }
.toggle:has(input:checked) { background: var(--pink-soft); border-color: var(--pink); color: var(--pink); }
details.adv { margin-top: 12px; }
details.adv summary { cursor: pointer; color: var(--text-2); font-size: 13px; list-style: none; display: inline-flex; align-items: center; gap: 4px; }
details.adv summary::-webkit-details-marker { display: none; }
details.adv summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; line-height: 1; }
details.adv[open] summary::before { transform: rotate(90deg); }
.adv-body { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 10px; }
.hint { font-size: 12px; color: var(--text-3); margin-top: 4px; }

/* tabs */
.tabs { display: flex; align-items: center; gap: 4px; margin: 22px 0 10px; }
.tab {
  border: 0; background: transparent; padding: 8px 14px; border-radius: 10px; cursor: pointer;
  color: var(--text-2); font-weight: 500;
}
.tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.tab .count { margin-left: 4px; font-size: 12px; color: var(--text-3); }
.tab.active .count { color: var(--pink); }

/* tasks */
.list { display: flex; flex-direction: column; gap: 10px; }
.task { display: flex; gap: 14px; padding: 14px; }
.cover {
  width: 132px; aspect-ratio: 16 / 10; flex: none; border-radius: 10px; overflow: hidden;
  background: var(--surface-2); display: grid; place-items: center; color: var(--text-3);
}
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover svg { width: 32px; height: 32px; }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.task-head { display: flex; gap: 8px; align-items: flex-start; }
.task-title { flex: 1; min-width: 0; font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; }
.badge { flex: none; font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 500; }
.badge.pending { background: var(--surface-2); color: var(--text-2); }
.badge.running { background: var(--blue-soft); color: var(--blue); }
.badge.done { background: var(--green-soft); color: var(--green); }
.badge.failed { background: var(--red-soft); color: var(--red); }
.meta { font-size: 12px; color: var(--text-3); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta span { white-space: nowrap; }
.meta .src { white-space: normal; word-break: break-all; }
.progress { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress > div { height: 100%; background: linear-gradient(90deg, var(--blue), var(--pink)); border-radius: 99px; transition: width .4s ease; }
.progress.indeterminate > div { width: 30% !important; animation: slide 1.2s ease-in-out infinite; }
@keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(340%); } }
.err { font-size: 12px; color: var(--red); background: var(--red-soft); padding: 6px 10px; border-radius: 8px; word-break: break-all; }
.outputs { display: flex; flex-wrap: wrap; gap: 6px; }
.out {
  display: inline-flex; align-items: center; gap: 4px; max-width: 100%;
  font-size: 12px; padding: 3px 10px; border-radius: 6px; background: var(--surface-2);
  text-decoration: none; color: var(--text-2); border: 1px solid transparent;
}
.out:hover { border-color: var(--pink); color: var(--pink); }
.out span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.out svg { width: 13px; height: 13px; flex: none; }
.task-actions { display: flex; gap: 6px; }

.list-tools { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
.list-tools .search { flex: 1; height: 34px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); outline: none; }
.list-tools .search:focus { border-color: var(--pink); }

/* files */
.files { overflow: hidden; }
.file { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border); }
.file:first-child { border-top: 0; }
.file-icon { width: 34px; height: 34px; flex: none; border-radius: 8px; display: grid; place-items: center; background: var(--surface-2); color: var(--text-2); }
.file-icon svg { width: 18px; height: 18px; }
.file-icon.video { background: var(--pink-soft); color: var(--pink); }
.file-icon.audio { background: var(--blue-soft); color: var(--blue); }
.file-main { flex: 1; min-width: 0; }
.file-name { word-break: break-all; }
.file-dir { color: var(--text-3); }
.file-meta { font-size: 12px; color: var(--text-3); }
.file-actions { display: flex; gap: 2px; flex: none; }

.empty { text-align: center; padding: 48px 16px; color: var(--text-3); }
.empty svg { width: 44px; height: 44px; opacity: .6; }
.empty p { margin: 8px 0 0; }

/* modal */
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { width: 100%; max-width: 380px; padding: 24px; text-align: center; }
.modal h2 { margin: 0 0 6px; font-size: 18px; }
.modal p { margin: 0 0 16px; color: var(--text-2); font-size: 13px; }
.modal .field { text-align: left; margin-bottom: 12px; }
.modal .btn { width: 100%; }
.modal .row { display: flex; gap: 8px; margin-top: 8px; }
.qr { width: 200px; height: 200px; margin: 4px auto 14px; border-radius: 12px; background: #fff; padding: 8px; display: grid; place-items: center; position: relative; }
.qr img { width: 100%; height: 100%; image-rendering: pixelated; }
.qr .over { position: absolute; inset: 0; background: rgba(255,255,255,.92); border-radius: 12px; display: grid; place-items: center; color: #18191c; font-weight: 600; }
.qr-state { min-height: 22px; font-size: 14px; }
.qr-state.ok { color: var(--green); }
.form-err { color: var(--red); font-size: 13px; min-height: 20px; margin-bottom: 8px; }

/* toast */
.toasts { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13px; box-shadow: 0 6px 24px rgba(0,0,0,.18); animation: pop .2s ease; }
.toast.error { background: var(--red); color: #fff; }
@keyframes pop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

footer { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 28px; }

@media (max-width: 640px) {
  .brand small { display: none; }
  .url-row { flex-direction: column; }
  .url-row .btn.primary { min-height: 42px; }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts .field:first-child { grid-column: span 2; }
  .adv-body { grid-template-columns: 1fr; }
  .task { gap: 10px; padding: 12px; }
  .cover { width: 88px; }
  .cover svg { width: 24px; height: 24px; }
  .task-title { font-size: 14px; }
  .chip .label-long { display: none; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="7" width="26" height="19" rx="5" fill="#fb7299"/><path d="M10 3l4 4M22 3l-4 4" stroke="#fb7299" stroke-width="2.5" stroke-linecap="round"/><path d="M16 12v8m-3.5-3.5L16 20l3.5-3.5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>BBDownT</span><small id="version"></small>
    </div>
    <div class="spacer"></div>
    <button class="chip" id="biliChip" type="button" hidden><span class="dot"></span><span id="biliText">B站账号</span></button>
    <button class="icon-btn" id="logoutBtn" type="button" title="退出网页登录" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
    </button>
  </div>
</header>

<div class="wrap">
  <form class="card composer" id="taskForm" autocomplete="off">
    <div class="url-row">
      <textarea class="url" id="url" rows="1" placeholder="粘贴视频链接或 BV/av/ep/ss 号，多个可换行" required></textarea>
      <button class="btn primary" id="submitBtn" type="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12m-5-5 5 5 5-5M5 20h14"/></svg>
        下载
      </button>
    </div>
    <div class="opts">
      <div class="field">
        <label for="quality">画质</label>
        <select id="quality" data-save>
          <option value="">最高画质</option>
          <option value="4K 超清,1080P 高码率,1080P 高帧率,1080P 高清">4K</option>
          <option value="1080P 高码率,1080P 高帧率,1080P 高清,720P 高清">1080P</option>
          <option value="720P 高帧率,720P 高清,480P 清晰">720P</option>
          <option value="480P 清晰,360P 流畅">480P</option>
        </select>
      </div>
      <div class="field">
        <label for="content">下载内容</label>
        <select id="content" data-save>
          <option value="">视频（含音频）</option>
          <option value="audio">仅音频</option>
          <option value="video">仅视频画面</option>
          <option value="sub">仅字幕</option>
          <option value="danmaku">仅弹幕</option>
          <option value="cover">仅封面</option>
        </select>
      </div>
      <div class="field">
        <label for="page">分P</label>
        <input type="text" id="page" placeholder="默认全部，如 1,3-5 或 LAST">
      </div>
    </div>
    <div class="toggles">
      <label class="toggle"><input type="checkbox" id="subtitle" data-save checked>字幕</label>
      <label class="toggle"><input type="checkbox" id="aiSub" data-save>无人工字幕时用AI字幕</label>
      <label class="toggle"><input type="checkbox" id="danmaku" data-save>弹幕</label>
      <label class="toggle"><input type="checkbox" id="cover" data-save checked>内嵌封面</label>
    </div>
    <details class="adv">
      <summary>高级选项</summary>
      <div class="adv-body">
        <div class="field">
          <label for="encoding">视频编码优先</label>
          <select id="encoding" data-save>
            <option value="">自动</option>
            <option value="hevc,avc,av1">HEVC (H.265)</option>
            <option value="avc,hevc,av1">AVC (H.264，兼容性最好)</option>
            <option value="av1,hevc,avc">AV1</option>
          </select>
        </div>
        <div class="field">
          <label for="api">解析接口</label>
          <select id="api" data-save>
            <option value="">WEB（默认）</option>
            <option value="tv">TV</option>
            <option value="app">APP</option>
            <option value="intl">国际版（东南亚）</option>
          </select>
        </div>
        <div class="field">
          <label for="filePattern">单P文件名</label>
          <input type="text" id="filePattern" data-save placeholder="&lt;videoTitle&gt;">
        </div>
        <div class="field">
          <label for="multiFilePattern">多P文件名</label>
          <input type="text" id="multiFilePattern" data-save placeholder="&lt;videoTitle&gt;/[P&lt;pageNumberWithZero&gt;]&lt;pageTitle&gt;">
        </div>
        <div class="field">
          <label class="toggle" style="margin-top:20px"><input type="checkbox" id="downloadAll">UP主空间链接：下载全部投稿</label>
          <div class="hint">不勾选时，空间链接只导出视频清单(TXT)</div>
        </div>
        <div class="field">
          <label for="delayPerVideo">投稿之间间隔（秒）</label>
          <input type="number" id="delayPerVideo" data-save min="0" value="10">
        </div>
      </div>
    </details>
  </form>

  <div class="tabs" role="tablist">
    <button class="tab active" data-tab="tasks" type="button">任务<span class="count" id="taskCount"></span></button>
    <button class="tab" data-tab="files" type="button">已下载文件<span class="count" id="fileCount"></span></button>
    <div class="spacer"></div>
    <button class="btn small" id="clearDone" type="button">清除已完成</button>
  </div>

  <section id="tasksPane">
    <div class="list" id="taskList"></div>
  </section>

  <section id="filesPane" hidden>
    <div class="list-tools">
      <input class="search" id="fileSearch" type="search" placeholder="搜索文件名">
      <button class="btn small" id="refreshFiles" type="button">刷新</button>
    </div>
    <div class="card files" id="fileList"></div>
  </section>

  <footer>任务队列保存在内存中，服务重启后任务记录会清空，已下载的文件不受影响。</footer>
</div>

<div class="mask" id="tokenModal" hidden>
  <form class="card modal" id="tokenForm">
    <h2>输入访问令牌</h2>
    <p>令牌在服务器的 .env 文件或启动日志中</p>
    <div class="field"><input type="password" id="tokenInput" placeholder="API Token" autocomplete="current-password" required></div>
    <div class="form-err" id="tokenErr"></div>
    <button class="btn primary" type="submit">进入</button>
  </form>
</div>

<div class="mask" id="biliModal" hidden>
  <div class="card modal">
    <h2>登录哔哩哔哩</h2>
    <p>登录后可下载 1080P 及以上画质和会员内容</p>
    <div class="qr"><img id="qrImg" alt="" hidden><div class="over" id="qrOver" hidden></div></div>
    <div class="qr-state" id="qrState">正在获取二维码…</div>
    <div class="row">
      <button class="btn" id="qrRefresh" type="button">刷新二维码</button>
      <button class="btn" id="qrClose" type="button">关闭</button>
    </div>
  </div>
</div>

<div class="toasts" id="toasts"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k) { try { return localStorage.getItem('bbdownt.' + k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem('bbdownt.' + k, v); } catch {} },
  };

  const ICON = {
    film: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg>',
    music: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>',
    file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m-4.5-4.5L12 15l4.5-4.5M5 20h14"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 5v14l11-7z"/></svg>',
    trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>',
    x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h5l1.5 3h5L16 13h5"/><path d="M5.5 5h13L21 13v5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-5z"/></svg>',
  };
  const VIDEO_EXT = ['mp4', 'mkv', 'flv', 'webm', 'mov', 'm4v'];
  const AUDIO_EXT = ['m4a', 'mp3', 'aac', 'flac', 'eac3', 'ec3', 'opus', 'wav'];
  const IMAGE_EXT = ['jpg', 'jpeg', 'png', 'webp', 'gif'];
  const extOf = (p) => (p.split('.').pop() || '').toLowerCase();
  const baseName = (p) => p.split(/[\\/]/).pop();

  function toast(msg, isError) {
    const el = document.createElement('div');
    el.className = 'toast' + (isError ? ' error' : '');
    el.textContent = msg;
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), isError ? 5000 : 2600);
  }

  function fmtBytes(n) {
    if (!n || n < 0) return '0 B';
    const u = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
    return (i === 0 ? n : n.toFixed(n >= 100 ? 0 : 1)) + ' ' + u[i];
  }
  function fmtTime(ts) {
    if (!ts) return '';
    const d = new Date(ts * 1000);
    const p = (x) => String(x).padStart(2, '0');
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    return (sameDay ? '今天 ' : `${d.getMonth() + 1}月${d.getDate()}日 `) + `${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  function fmtDuration(sec) {
    if (sec < 60) return sec + ' 秒';
    if (sec < 3600) return Math.floor(sec / 60) + ' 分 ' + (sec % 60) + ' 秒';
    return Math.floor(sec / 3600) + ' 小时 ' + Math.floor((sec % 3600) / 60) + ' 分';
  }

  // ---------- API ----------
  class AuthError extends Error {}
  async function api(path, opts = {}) {
    const init = { method: opts.method || 'GET', headers: {}, credentials: 'same-origin' };
    if (opts.body !== undefined) {
      init.headers['Content-Type'] = 'application/json';
      init.body = JSON.stringify(opts.body);
    }
    const res = await fetch(path, init);
    if (res.status === 401 && !opts.allow401) {
      showTokenModal();
      throw new AuthError('unauthorized');
    }
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }
    if (!res.ok) {
      const msg = typeof data === 'string' ? data.replace(/^"|"$/g, '') : (data && (data.detail || data.title)) || ('请求失败 ' + res.status);
      const err = new Error(msg);
      err.status = res.status;
      throw err;
    }
    return data;
  }

  // ---------- token ----------
  function showTokenModal() {
    if (!$('tokenModal').hidden) return;
    stopPolling();
    $('tokenErr').textContent = '';
    $('tokenModal').hidden = false;
    setTimeout(() => $('tokenInput').focus(), 50);
  }
  $('tokenForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('tokenErr').textContent = '';
    try {
      await api('/ui/session', { method: 'POST', body: { Token: $('tokenInput').value }, allow401: true });
      $('tokenModal').hidden = true;
      $('tokenInput').value = '';
      start();
    } catch (err) {
      $('tokenErr').textContent = err.status === 401 ? '令牌不正确' : err.message;
    }
  });
  $('logoutBtn').addEventListener('click', async () => {
    await api('/ui/session', { method: 'DELETE', allow401: true }).catch(() => {});
    location.reload();
  });

  // ---------- status / bili login ----------
  let status = null;
  async function loadStatus() {
    status = await api('/ui/status');
    $('version').textContent = 'v' + status.Version;
    $('logoutBtn').hidden = !status.AuthRequired;
    renderBiliChip();
  }
  function renderBiliChip() {
    const chip = $('biliChip');
    chip.hidden = false;
    chip.classList.remove('ok', 'warn');
    if (status.BiliUserName) {
      chip.classList.add('ok');
      $('biliText').innerHTML = `<span class="label-long">B站：</span>${esc(status.BiliUserName)}`;
      chip.title = '点击退出B站账号';
    } else if (status.BiliCookieSaved) {
      chip.classList.add('warn');
      $('biliText').textContent = 'B站登录已失效';
      chip.title = '点击重新扫码登录';
    } else {
      $('biliText').innerHTML = '登录B站<span class="label-long">（解锁高画质）</span>';
      chip.title = '扫码登录哔哩哔哩账号';
    }
  }
  $('biliChip').addEventListener('click', async () => {
    if (status && status.BiliUserName) {
      if (!confirm(`退出B站账号「${status.BiliUserName}」？退出后只能下载低画质。`)) return;
      await api('/ui/bili-login', { method: 'DELETE' });
      toast('已退出B站账号');
      loadStatus().catch(() => {});
      return;
    }
    openBiliLogin();
  });

  let qrTimer = null;
  let qrKey = null;
  function closeBiliLogin() {
    clearTimeout(qrTimer);
    qrKey = null;
    $('biliModal').hidden = true;
  }
  async function openBiliLogin() {
    $('biliModal').hidden = false;
    clearTimeout(qrTimer);
    $('qrImg').hidden = true;
    $('qrImg').removeAttribute('src');
    $('qrOver').hidden = true;
    $('qrState').className = 'qr-state';
    $('qrState').textContent = '正在获取二维码…';
    try {
      const res = await api('/ui/bili-login', { method: 'POST' });
      qrKey = res.Key;
      $('qrImg').src = res.QrCode;
      $('qrImg').hidden = false;
      $('qrState').textContent = '请使用哔哩哔哩 App 扫码';
      pollQr(res.Key);
    } catch (err) {
      if (err instanceof AuthError) return closeBiliLogin();
      $('qrState').textContent = err.message;
    }
  }
  function pollQr(key) {
    qrTimer = setTimeout(async () => {
      if (key !== qrKey) return;
      try {
        const res = await api('/ui/bili-login/' + encodeURIComponent(key));
        if (key !== qrKey) return;
        if (res.State === 'scanned') {
          $('qrOver').hidden = false;
          $('qrOver').textContent = '已扫码';
          $('qrState').textContent = '请在手机上确认登录';
        } else if (res.State === 'expired') {
          $('qrOver').hidden = false;
          $('qrOver').textContent = '已过期';
          $('qrState').textContent = '二维码已过期，请刷新';
          return;
        } else if (res.State === 'success') {
          $('qrState').className = 'qr-state ok';
          $('qrState').textContent = '登录成功' + (res.UserName ? '：' + res.UserName : '');
          setTimeout(closeBiliLogin, 900);
          loadStatus().catch(() => {});
          return;
        }
      } catch (err) {
        if (err instanceof AuthError) return closeBiliLogin();
        $('qrState').textContent = err.message;
      }
      pollQr(key);
    }, 1500);
  }
  $('qrRefresh').addEventListener('click', openBiliLogin);
  $('qrClose').addEventListener('click', closeBiliLogin);

  // ---------- form ----------
  const saved = document.querySelectorAll('[data-save]');
  saved.forEach((el) => {
    const v = store.get('opt.' + el.id);
    if (v !== null) {
      if (el.type === 'checkbox') el.checked = v === '1'; else el.value = v;
    }
    el.addEventListener('change', () => store.set('opt.' + el.id, el.type === 'checkbox' ? (el.checked ? '1' : '0') : el.value));
  });
  const urlBox = $('url');
  urlBox.addEventListener('input', () => {
    urlBox.style.height = 'auto';
    urlBox.style.height = Math.min(urlBox.scrollHeight + 3, 160) + 'px';
  });
  urlBox.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
      e.preventDefault();
      $('taskForm').requestSubmit();
    }
  });

  function buildRequest(url) {
    const body = { Url: url };
    const q = $('quality').value;
    if (q) body.DfnPriority = q;
    const enc = $('encoding').value;
    if (enc) body.EncodingPriority = enc;
    switch ($('content').value) {
      case 'audio': body.AudioOnly = true; break;
      case 'video': body.VideoOnly = true; break;
      case 'sub': body.SubOnly = true; break;
      case 'danmaku': body.DanmakuOnly = true; break;
      case 'cover': body.CoverOnly = true; break;
    }
    const page = $('page').value.trim();
    if (page) body.SelectPage = page;
    if (!$('subtitle').checked) body.SkipSubtitle = true;
    else if ($('aiSub').checked) body.AiSubtitlePolicy = 'prefer-human';
    if ($('danmaku').checked) body.DownloadDanmaku = true;
    if (!$('cover').checked) body.SkipCover = true;
    switch ($('api').value) {
      case 'tv': body.UseTvApi = true; break;
      case 'app': body.UseAppApi = true; break;
      case 'intl': body.UseIntlApi = true; break;
    }
    const fp = $('filePattern').value.trim();
    if (fp) body.FilePattern = fp;
    const mfp = $('multiFilePattern').value.trim();
    if (mfp) body.MultiFilePattern = mfp;
    if ($('downloadAll').checked) {
      body.DownloadAll = true;
      const delay = parseInt($('delayPerVideo').value, 10);
      if (!Number.isNaN(delay) && delay >= 0) body.DelayPerVideo = delay;
    }
    return body;
  }

  $('taskForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const urls = urlBox.value.split(/\s+/).map((s) => s.trim()).filter(Boolean);
    if (!urls.length) return;
    const btn = $('submitBtn');
    btn.disabled = true;
    let ok = 0;
    const failed = [];
    for (const url of urls) {
      try {
        await api('/add-task', { method: 'POST', body: buildRequest(url) });
        ok++;
      } catch (err) {
        if (err instanceof AuthError) break;
        failed.push(url);
        toast(`${url}：${err.message}`, true);
      }
    }
    btn.disabled = false;
    urlBox.value = failed.join('\n');
    urlBox.dispatchEvent(new Event('input'));
    if (ok) {
      toast(ok > 1 ? `已添加 ${ok} 个任务` : '已添加任务');
      switchTab('tasks');
      refreshTasks();
    }
  });

  // ---------- tabs ----------
  let activeTab = 'tasks';
  function switchTab(tab) {
    activeTab = tab;
    document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.tab === tab));
    $('tasksPane').hidden = tab !== 'tasks';
    $('filesPane').hidden = tab !== 'files';
    $('clearDone').hidden = tab !== 'tasks';
    if (tab === 'files') refreshFiles();
  }
  document.querySelectorAll('.tab').forEach((t) => t.addEventListener('click', () => switchTab(t.dataset.tab)));

  // ---------- tasks ----------
  let lastTasks = null;
  let finishedIds = new Set();
  function taskCard(t, state) {
    const title = t.Title || t.Url;
    const pic = t.Pic ? t.Pic.replace(/^http:/, 'https:') + '@320w_200h_1c.webp' : '';
    let badge = '';
    if (state === 'pending') badge = '<span class="badge pending">排队中</span>';
    else if (state === 'running') badge = '<span class="badge running">下载中</span>';
    else if (t.IsSuccessful) badge = '<span class="badge done">已完成</span>';
    else badge = '<span class="badge failed">失败</span>';

    const meta = [];
    if (state === 'running') {
      meta.push(`<span>${(t.Progress * 100).toFixed(1)}%</span>`);
      if (t.DownloadSpeed > 0) meta.push(`<span>${fmtBytes(t.DownloadSpeed)}/s</span>`);
      if (t.TotalDownloadedBytes > 0) meta.push(`<span>已下载 ${fmtBytes(t.TotalDownloadedBytes)}</span>`);
    } else if (state === 'finished') {
      if (t.TaskFinishTime) meta.push(`<span>${fmtTime(t.TaskFinishTime)} 完成</span>`);
      if (t.TaskFinishTime && t.TaskCreateTime) meta.push(`<span>耗时 ${fmtDuration(Math.max(0, t.TaskFinishTime - t.TaskCreateTime))}</span>`);
      if (t.IsSuccessful && t.TotalDownloadedBytes > 0) meta.push(`<span>${fmtBytes(t.TotalDownloadedBytes)}</span>`);
    } else {
      meta.push(`<span>${fmtTime(t.TaskCreateTime)} 添加</span>`);
    }
    if (t.Title) meta.push(`<span class="src">${esc(t.Url)}</span>`);

    let progress = '';
    if (state === 'running') {
      const pct = Math.max(0, Math.min(100, t.Progress * 100));
      progress = `<div class="progress${pct === 0 ? ' indeterminate' : ''}"><div style="width:${pct}%"></div></div>`;
    }
    const err = t.Error ? `<div class="err">${esc(t.Error)}</div>` : '';
    const outputs = (t.SavePaths || []).map((p, i) => {
      const ext = extOf(p);
      const icon = VIDEO_EXT.includes(ext) ? ICON.film : AUDIO_EXT.includes(ext) ? ICON.music : ICON.file;
      const href = `/files/download?task=${encodeURIComponent(t.TaskId)}&index=${i}`;
      return `<a class="out" href="${href}" download title="下载 ${esc(baseName(p))}">${icon}<span>${esc(baseName(p))}</span></a>`;
    }).join('');
    const actions = state === 'finished'
      ? `<button class="icon-btn" data-remove="${esc(t.TaskId)}" type="button" title="移除记录（不删除文件）">${ICON.x}</button>`
      : '';
    return `<div class="card task">
      <div class="cover">${pic ? `<img src="${esc(pic)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ICON.film}</div>
      <div class="task-main">
        <div class="task-head"><div class="task-title" title="${esc(title)}">${esc(title)}</div>${badge}<div class="task-actions">${actions}</div></div>
        <div class="meta">${meta.join('')}</div>
        ${progress}${err}
        ${outputs ? `<div class="outputs">${outputs}</div>` : ''}
      </div>
    </div>`;
  }
  function renderTasks(c) {
    const finished = [...c.Finished].sort((a, b) => (b.TaskFinishTime || 0) - (a.TaskFinishTime || 0));
    const html = [
      ...c.Running.map((t) => taskCard(t, 'running')),
      ...c.Pending.map((t) => taskCard(t, 'pending')),
      ...finished.map((t) => taskCard(t, 'finished')),
    ].join('');
    const total = c.Running.length + c.Pending.length + c.Finished.length;
    $('taskCount').textContent = total ? String(total) : '';
    $('taskList').innerHTML = html || `<div class="card empty">${ICON.inbox}<p>还没有任务，粘贴链接开始下载吧</p></div>`;
  }
  $('taskList').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-remove]');
    if (!btn) return;
    await api('/remove-finished/' + encodeURIComponent(btn.dataset.remove), { method: 'DELETE' }).catch(() => {});
    refreshTasks();
  });
  $('clearDone').addEventListener('click', async () => {
    await api('/remove-finished/', { method: 'DELETE' }).catch(() => {});
    refreshTasks();
  });

  async function refreshTasks() {
    const c = await api('/get-tasks/');
    const json = JSON.stringify(c);
    if (json !== lastTasks) {
      lastTasks = json;
      renderTasks(c);
    }
    // 有任务完成时刷新文件列表
    const ids = new Set(c.Finished.map((t) => t.TaskId));
    const hasNew = [...ids].some((id) => !finishedIds.has(id));
    finishedIds = ids;
    if (hasNew && filesLoaded) refreshFiles();
    return c.Running.length + c.Pending.length > 0;
  }

  // ---------- files ----------
  let files = [];
  let filesLoaded = false;
  function fileUrl(path, inline) {
    return '/files/download?path=' + encodeURIComponent(path) + (inline ? '&inline=1' : '');
  }
  function renderFiles() {
    const kw = $('fileSearch').value.trim().toLowerCase();
    const list = kw ? files.filter((f) => f.Path.toLowerCase().includes(kw)) : files;
    $('fileCount').textContent = files.length ? String(files.length) : '';
    if (!list.length) {
      $('fileList').innerHTML = `<div class="empty">${ICON.inbox}<p>${kw ? '没有匹配的文件' : '还没有下载完成的文件'}</p></div>`;
      return;
    }
    $('fileList').innerHTML = list.map((f) => {
      const ext = extOf(f.Path);
      const kind = VIDEO_EXT.includes(ext) ? 'video' : AUDIO_EXT.includes(ext) ? 'audio' : '';
      const icon = kind === 'video' ? ICON.film : kind === 'audio' ? ICON.music : ICON.file;
      const slash = f.Path.lastIndexOf('/');
      const dir = slash >= 0 ? f.Path.slice(0, slash + 1) : '';
      const name = f.Path.slice(slash + 1);
      const playable = kind || IMAGE_EXT.includes(ext);
      return `<div class="file">
        <div class="file-icon ${kind}">${icon}</div>
        <div class="file-main">
          <div class="file-name"><span class="file-dir">${esc(dir)}</span>${esc(name)}</div>
          <div class="file-meta">${fmtBytes(f.Size)} · ${fmtTime(f.ModifiedTime)}</div>
        </div>
        <div class="file-actions">
          ${playable ? `<a class="icon-btn" href="${fileUrl(f.Path, true)}" target="_blank" rel="noopener" title="在线播放/预览">${ICON.play}</a>` : ''}
          <a class="icon-btn" href="${fileUrl(f.Path)}" download title="下载到本机">${ICON.down}</a>
          <button class="icon-btn" data-del="${esc(f.Path)}" type="button" title="从服务器删除">${ICON.trash}</button>
        </div>
      </div>`;
    }).join('');
  }
  async function refreshFiles() {
    try {
      files = await api('/files/');
      filesLoaded = true;
      renderFiles();
    } catch (err) {
      if (!(err instanceof AuthError)) toast(err.message, true);
    }
  }
  $('fileSearch').addEventListener('input', renderFiles);
  $('refreshFiles').addEventListener('click', refreshFiles);
  $('fileList').addEventListener('click', async (e) => {
    const btn = e.target.closest('[data-del]');
    if (!btn) return;
    const path = btn.dataset.del;
    if (!confirm(`从服务器删除「${baseName(path)}」？此操作无法撤销。`)) return;
    try {
      await api('/files/?path=' + encodeURIComponent(path), { method: 'DELETE' });
      toast('已删除');
    } catch (err) {
      if (!(err instanceof AuthError)) toast(err.message, true);
    }
    refreshFiles();
  });

  // ---------- polling ----------
  let pollTimer = null;
  let polling = false;
  function stopPolling() {
    polling = false;
    clearTimeout(pollTimer);
  }
  async function poll() {
    if (!polling) return;
    let busy = false;
    try {
      busy = await refreshTasks();
    } catch (err) {
      if (err instanceof AuthError) return;
    }
    if (!polling) return;
    pollTimer = setTimeout(poll, document.hidden ? 10000 : busy ? 1200 : 4000);
  }
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && polling) { clearTimeout(pollTimer); poll(); }
  });

  async function start() {
    try {
      await loadStatus();
    } catch (err) {
      if (err instanceof AuthError) return;
      toast('无法连接服务器：' + err.message, true);
    }
    refreshFiles();
    stopPolling();
    polling = true;
    poll();
  }
  switchTab('tasks');
  start();
})();
</script>
</body>
</html>
